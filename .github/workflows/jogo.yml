name: Navio Pirata

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas (00:00 e 12:00 UTC)
  workflow_dispatch:          # botão para rodar manualmente
  push:
    branches: [main]          # roda quando você editar o README ou o gerador

permissions:
  contents: write

concurrency:
  group: navio-pirata
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar o navio pirata
        run: node .github/pirata/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Publicar na branch pirata
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: pirata
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
