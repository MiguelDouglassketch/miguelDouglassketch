name: Pac-Man das contribuicoes

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas (00:00 e 12:00 UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
  push:
    branches:
      - main                  # roda quando você editar o README

concurrency:
  group: breakout
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gerar o gráfico de contribuições (Breakout)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Publicar os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
